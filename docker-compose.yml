version: '3.8'

services:
  dashboard:
    build: .
    container_name: company_dashboard
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=change_this_in_production_please
    volumes:
      - ./logs:/app/logs
    networks:
      - dashboard_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/api/test-connection"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  dashboard_network:
    driver: bridge