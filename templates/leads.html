<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --header-bg-light: linear-gradient(90deg, #1a2a3a 0%, #3a4a5e 100%);
            --header-bg-dark: linear-gradient(90deg, #0f1620 0%, #1c2631 100%);
            --card-hover-shadow-light: 0 4px 8px rgba(0,0,0,.1);
            --card-hover-shadow-dark: 0 4px 8px rgba(255,255,255,.05);
        }
        body{font-family:system-ui,-apple-system,sans-serif;transition:background-color 0.3s ease}
        .header{background:var(--header-bg-light);color:white;padding:1rem;margin-bottom:1.5rem;transition:background 0.3s ease}
        .card{transition:transform .2s, box-shadow 0.3s ease;border:none}
        .card:hover{transform:translateY(-3px);box-shadow:var(--card-hover-shadow-light)}
        .stat-card{border-radius:8px;overflow:hidden}
        .table-card{border-radius:8px;overflow:hidden}
        .ctr-badge{border-radius:20px;padding:6px 12px;font-size:13px;font-weight:600;display:inline-block}
        .bg-excellent{background:#28a745!important}
        .bg-good{background:#17a2b8!important}
        .bg-average{background:#ffc107!important;color:#212529!important}
        .bg-poor{background:#dc3545!important}
        .badge-indicator{width:10px;height:10px;display:inline-block;border-radius:50%;margin-right:5px}
        .perf-text{font-size:12px;font-weight:500}
        .theme-switch{cursor:pointer}
        .excluded-campaign{opacity:0.6;font-style:italic}
        .campaign-action{
            width:32px;height:32px;padding:0;
            display:flex;align-items:center;justify-content:center;
            border-radius:50%;
        }
        
        /* Dark mode overrides */
        [data-bs-theme="dark"] .header {
            background: var(--header-bg-dark);
        }
        [data-bs-theme="dark"] .card:hover {
            box-shadow: var(--card-hover-shadow-dark);
        }
        [data-bs-theme="dark"] .bg-light {
            background-color: #2b3035!important;
        }
        @media (max-width:768px){
            .hide-mobile{display:none}
            .table-responsive{overflow-x:auto}
            .stat-card{margin-bottom:1rem}
            .ctr-badge{padding:3px 8px;font-size:11px}
            .campaign-action{width:28px;height:28px}
            .header{padding:0.75rem}
            .header h3{font-size:1.25rem}
            .card-header .d-flex{flex-direction:column;align-items:flex-start}
            .card-header .text-muted{margin-top:0.5rem}
            #resetFilters{margin-top:0.5rem !important;margin-left:0 !important}
            .filter-controls{margin-top:0.5rem;width:100%}
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center">
                <h3 class="m-0"><i class="bi bi-graph-up me-2"></i> Campaign Performance</h3>
                <div>
                    <a href="/" class="btn btn-outline-light btn-sm">
                        <i class="bi bi-house-door"></i> Home
                    </a>
                    <button id="refreshData" class="btn btn-outline-light btn-sm ms-2">
                        <i class="bi bi-arrow-repeat"></i> Refresh
                    </button>
                    <button id="themeToggle" class="btn btn-outline-light btn-sm ms-2 theme-switch">
                        <i class="bi bi-sun-fill" id="lightIcon"></i>
                        <i class="bi bi-moon-fill d-none" id="darkIcon"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Main Content -->
    <div class="container-fluid">
        <!-- Summary Cards -->
        <!-- Desktop stats cards - hidden on mobile -->
        <div class="row mb-4 d-none d-md-flex">
            <div class="col-md-3">
                <div class="card shadow-sm stat-card h-100">
                    <div class="card-body text-center">
                        <div class="d-flex align-items-center justify-content-center mb-2">
                            <i class="bi bi-currency-rupee fs-5 text-primary me-2"></i>
                            <h6 class="text-muted mb-0">Total Spend</h6>
                        </div>
                        <h3 class="text-primary" id="totalSpend">₹0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card shadow-sm stat-card h-100">
                    <div class="card-body text-center">
                        <div class="d-flex align-items-center justify-content-center mb-2">
                            <i class="bi bi-people fs-5 text-success me-2"></i>
                            <h6 class="text-muted mb-0">Total Leads</h6>
                        </div>
                        <h3 class="text-success" id="totalLeads">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card shadow-sm stat-card h-100">
                    <div class="card-body text-center">
                        <div class="d-flex align-items-center justify-content-center mb-2">
                            <i class="bi bi-calculator fs-5 text-danger me-2"></i>
                            <h6 class="text-muted mb-0">Average CPL</h6>
                        </div>
                        <h3 class="text-danger" id="avgCpl">₹0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card shadow-sm stat-card h-100">
                    <div class="card-body text-center">
                        <div class="d-flex align-items-center justify-content-center mb-2">
                            <i class="bi bi-bar-chart fs-5 text-info me-2"></i>
                            <h6 class="text-muted mb-0">Click-Through Rate</h6>
                        </div>
                        <h3 class="text-info" id="ctr">0%</h3>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Performance Legend - Desktop -->
        <div class="d-none d-md-flex justify-content-end mb-2">
            <div class="d-flex align-items-center me-3">
                <span class="badge-indicator bg-excellent"></span>
                <span class="perf-text">Excellent</span>
            </div>
            <div class="d-flex align-items-center me-3">
                <span class="badge-indicator bg-good"></span>
                <span class="perf-text">Good</span>
            </div>
            <div class="d-flex align-items-center me-3">
                <span class="badge-indicator bg-average"></span>
                <span class="perf-text">Average</span>
            </div>
            <div class="d-flex align-items-center">
                <span class="badge-indicator bg-poor"></span>
                <span class="perf-text">Poor</span>
            </div>
        </div>
        
        <!-- Performance Legend - Mobile (More compact) -->
        <div class="d-flex d-md-none justify-content-between mb-2">
            <div class="d-flex align-items-center" style="font-size: 10px;">
                <span class="badge-indicator bg-excellent"></span>
                <span class="ms-1">Excellent</span>
                <span class="badge-indicator bg-good ms-2"></span>
                <span class="ms-1">Good</span>
            </div>
            <div class="d-flex align-items-center" style="font-size: 10px;">
                <span class="badge-indicator bg-average"></span>
                <span class="ms-1">Average</span>
                <span class="badge-indicator bg-poor ms-2"></span>
                <span class="ms-1">Poor</span>
            </div>
        </div>
        
        <!-- Mobile Quick Stats - Only visible on mobile -->
        <div class="d-md-none mb-3">
            <div class="alert alert-info py-2 mb-0 d-flex justify-content-between align-items-center">
                <div>
                    <span class="badge bg-light text-dark me-1"><span id="totalLeadsMobile">0</span> leads</span>
                    <span class="badge bg-light text-dark"><span id="avgCplMobile">₹0</span> CPL</span>
                </div>
                <div>
                    <button id="refreshMobile" class="btn btn-sm btn-primary px-2 py-1">
                        <i class="bi bi-arrow-repeat"></i>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Campaign Table -->
        <div class="card shadow-sm table-card">
            <div class="card-header bg-light">
                <div class="d-flex justify-content-between align-items-center flex-wrap">
                    <div class="d-flex align-items-center flex-wrap">
                        <h5 class="mb-0 me-2">Campaign Performance</h5>
                        <div id="filterInfo" class="badge bg-primary rounded-pill d-none">
                            <i class="bi bi-funnel-fill me-1"></i> Filtered
                        </div>
                    </div>
                    <div class="text-muted small">
                        Last updated: <span id="lastUpdated">-</span>
                        <span class="spinner-border spinner-border-sm text-primary d-none ms-2" id="spinner" role="status"></span>
                    </div>
                </div>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-striped mb-0">
                        <thead>
                            <tr>
                                <th style="width: 30%">Campaign</th>
                                <th class="text-end" style="width: 12%">Spend</th>
                                <th class="text-end hide-mobile" style="width: 10%">Impressions</th>
                                <th class="text-end hide-mobile" style="width: 8%">Clicks</th>
                                <th class="text-end" style="width: 8%">Leads</th>
                                <th class="text-end" style="width: 12%">CPL</th>
                                <th class="text-center" style="width: 10%">Rating</th>
                                <th class="text-center" style="width: 7%"></th>
                            </tr>
                        </thead>
                        <tbody id="campaignTableBody">
                            <tr>
                                <td colspan="8" class="text-center">Loading campaign data...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Cache DOM elements for better performance
        let elements = {};
        
        // Format currency
        function formatCurrency(value) {
            return new Intl.NumberFormat('en-IN', {
                maximumFractionDigits: 2
            }).format(value);
        }
        
        // Calculate CPL score (0-100)
        function calculateCplScore(cpl, avgCpl) {
            if (cpl === 0 || avgCpl === 0) return 0;
            
            // Lower CPL is better - score based on percentage of average
            const ratio = avgCpl / cpl;
            
            // Score scale: 
            // 2.0+ ratio (CPL half of average or better) = 100
            // 1.0 ratio (CPL = average) = 50
            // 0.5 ratio (CPL twice average) = 0
            let score = (ratio - 0.5) * 100;
            
            // Clamp between 0-100
            return Math.max(0, Math.min(100, score));
        }
        
        // Get performance indicator
        function getPerformanceIndicator(score) {
            if (score >= 80) return { class: 'bg-excellent', text: 'Excellent' };
            if (score >= 60) return { class: 'bg-good', text: 'Good' };
            if (score >= 40) return { class: 'bg-average', text: 'Average' };
            return { class: 'bg-poor', text: 'Poor' };
        }
        
        // Calculate CTR
        function calculateCTR(clicks, impressions) {
            if (!impressions) return 0;
            return (clicks / impressions) * 100;
        }
        
        // Toggle theme function
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-bs-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            // Update HTML attribute
            html.setAttribute('data-bs-theme', newTheme);
            
            // Update button icons
            const lightIcon = document.getElementById('lightIcon');
            const darkIcon = document.getElementById('darkIcon');
            
            if (newTheme === 'dark') {
                lightIcon.classList.add('d-none');
                darkIcon.classList.remove('d-none');
            } else {
                darkIcon.classList.add('d-none');
                lightIcon.classList.remove('d-none');
            }
            
            // Save preference to localStorage
            localStorage.setItem('theme', newTheme);
        }
        
        // Fetch and display campaign data
        function fetchCampaignData() {
            // Show loading spinner
            elements.spinner.classList.remove('d-none');
            
            fetch('/api/campaigns', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ date_preset: 'today' })
            })
            .then(response => {
                if (!response.ok) throw new Error('API request failed');
                return response.json();
            })
            .then(data => {
                // Remove the original summary cards update as we'll do it after filtering
                
                // Add a campaign ID if missing (needed for identification)
                if (data.campaigns && data.campaigns.length > 0) {
                    data.campaigns.forEach((campaign, index) => {
                        if (!campaign.campaign_id) {
                            campaign.campaign_id = campaign.id || `campaign-${index}`;
                        }
                    });
                }
                
                // Prepare to track excluded campaign IDs
                let excludedCampaigns = JSON.parse(localStorage.getItem('excludedCampaigns') || '[]');
                
                // Update campaign table
                elements.tableBody.innerHTML = '';
                
                if (data.campaigns && data.campaigns.length > 0) {
                    // Sort campaigns by leads (highest first)
                    data.campaigns.sort((a, b) => b.leads - a.leads);
                    
                    // Create a filtered version for calculations
                    const filteredCampaigns = data.campaigns.filter(campaign => 
                        !excludedCampaigns.includes(campaign.campaign_id)
                    );
                    
                    // Recalculate totals based on filtered data
                    let filteredSpend = 0;
                    let filteredLeads = 0;
                    let filteredImpressions = 0;
                    let filteredClicks = 0;
                    
                    filteredCampaigns.forEach(campaign => {
                        filteredSpend += campaign.spend || 0;
                        filteredLeads += campaign.leads || 0;
                        filteredImpressions += campaign.impressions || 0;
                        filteredClicks += campaign.clicks || 0;
                    });
                    
                    // Calculate filtered average CPL
                    const filteredAvgCpl = filteredLeads > 0 ? filteredSpend / filteredLeads : 0;
                    
                    // Update summary cards with filtered data
                    elements.totalSpend.textContent = '₹ ' + formatCurrency(filteredSpend || 0);
                    elements.totalLeads.textContent = filteredLeads || 0;
                    elements.avgCpl.textContent = '₹ ' + formatCurrency(filteredAvgCpl || 0);
                    
                    // Update mobile quick stats
                    const totalLeadsMobile = document.getElementById('totalLeadsMobile');
                    if (totalLeadsMobile) {
                        totalLeadsMobile.textContent = filteredLeads || 0;
                    }
                    
                    const avgCplMobile = document.getElementById('avgCplMobile');
                    if (avgCplMobile) {
                        avgCplMobile.textContent = formatCurrency(filteredAvgCpl || 0);
                    }
                    
                    // Calculate filtered CTR
                    const filteredCTR = calculateCTR(filteredClicks, filteredImpressions);
                    elements.ctr.textContent = filteredCTR.toFixed(2) + '%';
                    
                    // Display all campaigns but mark excluded ones
                    data.campaigns.forEach(campaign => {
                        // Check if this campaign is excluded
                        const isExcluded = excludedCampaigns.includes(campaign.campaign_id);
                        
                        // Calculate performance score based on CPL
                        const cplScore = calculateCplScore(campaign.cpl, filteredAvgCpl);
                        const performance = getPerformanceIndicator(cplScore);
                        
                        // Calculate CTR for this campaign
                        const campaignCTR = calculateCTR(campaign.clicks, campaign.impressions);
                        
                        // Determine if CPL is higher than average (highlight in red)
                        const cplClass = campaign.cpl > filteredAvgCpl ? 'text-danger fw-bold' : '';
                        
                        const row = document.createElement('tr');
                        
                        // Add "excluded" class if this campaign is excluded
                        if (isExcluded) {
                            row.classList.add('text-muted');
                            row.style.opacity = '0.6';
                        }
                        
                        // Set data-campaign-id attribute for identification
                        row.setAttribute('data-campaign-id', campaign.campaign_id);
                        
                        row.innerHTML = `
                            <td title="${campaign.campaign_name}">
                                <div class="text-truncate" style="max-width: 300px;">${campaign.campaign_name}</div>
                            </td>
                            <td class="text-end">${formatCurrency(campaign.spend)}</td>
                            <td class="text-end hide-mobile">${formatCurrency(campaign.impressions)}</td>
                            <td class="text-end hide-mobile">${campaign.clicks}</td>
                            <td class="text-end fw-medium">${campaign.leads}</td>
                            <td class="text-end ${cplClass}">${formatCurrency(campaign.cpl)}</td>
                            <td class="text-center">
                                <span class="ctr-badge text-white ${performance.class}">${performance.text}</span>
                            </td>
                            <td class="text-center">
                                <button class="btn btn-sm ${isExcluded ? 'btn-outline-success' : 'btn-outline-danger'} campaign-action" 
                                        data-action="${isExcluded ? 'include' : 'exclude'}" 
                                        data-campaign-id="${campaign.campaign_id || campaign.id || index}"
                                        title="${isExcluded ? 'Include in calculations' : 'Exclude from calculations'}">
                                    <i class="bi ${isExcluded ? 'bi-plus-circle' : 'bi-x-circle'}"></i>
                                </button>
                            </td>
                        `;
                        
                        elements.tableBody.appendChild(row);
                    });
                    
                    // Add event listeners to action buttons
                    document.querySelectorAll('.campaign-action').forEach(button => {
                        button.addEventListener('click', function() {
                            const campaignId = this.getAttribute('data-campaign-id');
                            const action = this.getAttribute('data-action');
                            
                            if (action === 'exclude') {
                                // Add to excluded list
                                excludedCampaigns.push(campaignId);
                            } else {
                                // Remove from excluded list
                                excludedCampaigns = excludedCampaigns.filter(id => id !== campaignId);
                            }
                            
                            // Save to localStorage
                            localStorage.setItem('excludedCampaigns', JSON.stringify(excludedCampaigns));
                            
                            // Refresh the data display with new filtering
                            fetchCampaignData();
                        });
                    });
                } else {
                    elements.tableBody.innerHTML = '<tr><td colspan="8" class="text-center">No campaign data available</td></tr>';
                }
                
                // Update filter badge and reset button
                if (excludedCampaigns.length > 0) {
                    // Show the filter indicator
                    elements.filterInfo.classList.remove('d-none');
                    elements.filterInfo.textContent = ` ${excludedCampaigns.length} Campaign${excludedCampaigns.length > 1 ? 's' : ''} Hidden`;
                    elements.filterInfo.innerHTML = `<i class="bi bi-funnel-fill me-1"></i>${excludedCampaigns.length} Hidden`;
                    
                    // Create reset button if it doesn't exist
                    const resetButton = document.createElement('button');
                    resetButton.className = 'btn btn-sm btn-primary mt-2 ms-3';
                    resetButton.innerHTML = '<i class="bi bi-arrow-repeat me-1"></i> Reset All Filters';
                    resetButton.addEventListener('click', function() {
                        localStorage.removeItem('excludedCampaigns');
                        fetchCampaignData();
                    });
                    
                    // Add the reset button to the header
                    const tableHeader = document.querySelector('.card-header');
                    if (tableHeader && !document.getElementById('resetFilters')) {
                        resetButton.id = 'resetFilters';
                        tableHeader.appendChild(resetButton);
                    }
                } else {
                    // Hide the filter indicator
                    elements.filterInfo.classList.add('d-none');
                    
                    // Remove the reset button if no exclusions
                    const existingResetButton = document.getElementById('resetFilters');
                    if (existingResetButton) {
                        existingResetButton.remove();
                    }
                }
                
                // Update last updated time
                elements.lastUpdated.textContent = new Date().toLocaleTimeString();
                
                // Hide spinner
                elements.spinner.classList.add('d-none');
                
                // Auto-refresh every 60 seconds
                setTimeout(fetchCampaignData, 60000);
            })
            .catch(error => {
                console.error('Error fetching campaign data:', error);
                elements.spinner.classList.add('d-none');
                elements.tableBody.innerHTML = '<tr><td colspan="7" class="text-center text-danger">Error loading data. Retrying...</td></tr>';
                
                // Try again after 15 seconds
                setTimeout(fetchCampaignData, 15000);
            });
        }
        
        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            // Cache DOM elements
            elements = {
                totalSpend: document.getElementById('totalSpend'),
                totalLeads: document.getElementById('totalLeads'),
                avgCpl: document.getElementById('avgCpl'),
                ctr: document.getElementById('ctr'),
                tableBody: document.getElementById('campaignTableBody'),
                lastUpdated: document.getElementById('lastUpdated'),
                spinner: document.getElementById('spinner'),
                filterInfo: document.getElementById('filterInfo')
            };
            
            // Set up theme toggle
            document.getElementById('themeToggle').addEventListener('click', toggleTheme);
            
            // Load theme preference from localStorage
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-bs-theme', savedTheme);
                if (savedTheme === 'dark') {
                    document.getElementById('lightIcon').classList.add('d-none');
                    document.getElementById('darkIcon').classList.remove('d-none');
                }
            }
            
            // Initial data fetch
            fetchCampaignData();
            
            // Set up refresh buttons - both desktop and mobile
            document.getElementById('refreshData').addEventListener('click', fetchCampaignData);
            
            // Mobile refresh button
            const refreshMobileBtn = document.getElementById('refreshMobile');
            if (refreshMobileBtn) {
                refreshMobileBtn.addEventListener('click', fetchCampaignData);
            }
            
            // Optimize for faster loading
            document.querySelectorAll('img').forEach(img => {
                img.loading = 'lazy';
            });
        });
    </script>
    
    <!-- Deferred loading of Bootstrap JS -->
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
